# Linux packages: two .deb (built on Ubuntu 24.04 and 26.04) and one .rpm
# (built on Fedora), Qt bundled in /opt/hodeia (HODEIA_BUNDLE_QT=ON).
#
# The 24.04 .deb runs on every Debian/Ubuntu-based distro with glibc >= 2.39
# (Ubuntu 24.04+, Debian 13+, Mint 22+...); the 26.04 one has its Depends:
# computed against Ubuntu 26.04's own packages.  Each .deb carries its distro
# in the Debian revision (0.99~rc1-1~ubuntu26.04), so the file names differ.  The .rpm targets Fedora: system
# library sonames differ between RPM distros (libjpeg.so.62 vs .so.8...), so it
# is built on the oldest Fedora release we support.
#
# Each build produces two packages: hodeia (CPU + Vulkan) and hodeia-cuda
# (CUDA backend + CUDA runtime), see cmake/PackagingLinux.cmake.  CUDA comes
# from NVIDIA's redistributable archives (build-time only components).
#
# Triggers: a "v*" tag (packages attached to the GitHub release), a push to a
# "packaging/*" branch, or manually from the Actions tab (packages kept as
# workflow artifacts).

name: Linux packages

on:
  push:
    tags: ['v*']
    # Test branches: workflow_dispatch only works once this file is on master.
    branches: ['packaging/**']
  workflow_dispatch:

permissions:
  contents: write   # attach the packages to the release

env:
  QT_VERSION: '6.12.0'
  QT_DIR: /opt/Qt
  CUDA_VERSION: '13.4.3'
  CUDA_DIR: /opt/cuda
  # Components of redistrib_<CUDA_VERSION>.json needed to build ggml-cuda.
  CUDA_COMPONENTS: cuda_nvcc cuda_crt libnvvm cuda_cudart libcublas cccl cuda_nvrtc cuda_profiler_api

defaults:
  run:
    shell: bash

jobs:
  package:
    name: ${{ matrix.format }} (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu2404
            image: ubuntu:24.04
            format: DEB
            ext: deb
            # clang 18 (Ubuntu 24.04) does not see libstdc++'s std::expected
            # (it reports __cpp_concepts < 202002L): build with GCC 14.
            cc: gcc-14
            cxx: g++-14
            cc_pkgs: gcc-14 g++-14
          - id: ubuntu2604
            image: ubuntu:26.04
            format: DEB
            ext: deb
            cc: gcc
            cxx: g++
            cc_pkgs: ''
          - id: fedora44
            image: fedora:44
            format: RPM
            ext: rpm
            cc: clang
            cxx: clang++

    steps:
      # ── Toolchain + system libraries ────────────────────────────────────
      # The Qt runtime libraries (xcb, wayland, dbus...) must be installed so
      # that dpkg-shlibdeps can resolve the dependencies of the bundled Qt
      # plugins and turn them into "Depends:".
      - name: Install dependencies (Ubuntu)
        if: matrix.format == 'DEB'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ${{ matrix.cc_pkgs }} cmake ninja-build pkg-config \
            patchelf git git-lfs ca-certificates python3 python3-venv file \
            xz-utils dpkg-dev unzip zip gettext-base \
            libpng-dev libjpeg-turbo8-dev libtiff-dev zlib1g-dev libsqlite3-dev \
            libvulkan-dev glslc spirv-headers \
            libgl-dev libegl-dev libopengl0 libxkbcommon-dev libfontconfig-dev \
            libfreetype-dev \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-xfixes0 \
            libxcb-glx0 libxcb-shm0 libxcb-util1 libxcb-xinput0 \
            libxkbcommon-x11-0 libxrender1 libxi6 libsm6 libice6 \
            libdbus-1-3 libglib2.0-0t64 libgssapi-krb5-2 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install dependencies (Fedora)
        if: matrix.format == 'RPM'
        run: |
          dnf install -y \
            gcc-c++ clang libomp-devel cmake ninja-build make pkgconf-pkg-config \
            patchelf git git-lfs python3 file xz tar findutils rpm-build unzip zip \
            /usr/bin/envsubst \
            libpng-devel libjpeg-turbo-devel libtiff-devel zlib-devel sqlite-devel \
            vulkan-loader-devel vulkan-headers glslc spirv-headers-devel \
            mesa-libGL-devel mesa-libEGL-devel libglvnd-opengl \
            libxkbcommon-devel fontconfig-devel freetype-devel \
            xcb-util-cursor xcb-util-wm xcb-util-image xcb-util-keysyms \
            xcb-util-renderutil libxkbcommon-x11 libXrender libXi libSM libICE \
            dbus-libs glib2 krb5-libs \
            libwayland-client libwayland-cursor libwayland-egl

      # ── Sources (the bundled .gguf models are Git LFS objects) ──────────
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Mark the workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # LFS bandwidth is metered: cache the objects, keyed on their ids.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: |
          git lfs pull
          # Fail early if a model is still a pointer file.
          git lfs ls-files --name-only | while IFS= read -r f; do
            if head -c 100 "$f" | grep -q '^version https://git-lfs'; then
              echo "::error::$f is still a Git LFS pointer"; exit 1
            fi
          done

      # ── Qt (bundled into the package) ───────────────────────────────────
      - name: Cache Qt
        id: qt
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64

      - name: Install Qt
        if: steps.qt.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --outputdir "$QT_DIR"

      # ── CUDA toolkit (redistributable archives, for hodeia-cuda) ────────
      - name: Cache CUDA
        id: cuda
        uses: actions/cache@v6
        with:
          path: ${{ env.CUDA_DIR }}
          key: cuda-linux-${{ env.CUDA_VERSION }}-${{ env.CUDA_COMPONENTS }}

      - name: Install CUDA
        if: steps.cuda.outputs.cache-hit != 'true'
        run: |
          base=https://developer.download.nvidia.com/compute/cuda/redist
          curl -fsSL -o "$RUNNER_TEMP/cuda.json" "$base/redistrib_$CUDA_VERSION.json"
          mkdir -p "$CUDA_DIR"
          for c in $CUDA_COMPONENTS; do
            rel=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]]["linux-x86_64"]["relative_path"])' \
                  "$RUNNER_TEMP/cuda.json" "$c")
            echo ">> $rel"
            tmp="$RUNNER_TEMP/cuda-$c"
            mkdir -p "$tmp"
            curl -fsSL "$base/$rel" | tar -xJ -C "$tmp"
            # Each archive holds one top folder with bin/, include/, lib/...
            cp -a "$tmp"/*/. "$CUDA_DIR"/
            rm -rf "$tmp"
          done

      - name: Use CUDA
        run: |
          echo "CUDA_PATH=$CUDA_DIR" >> "$GITHUB_ENV"
          echo "CUDACXX=$CUDA_DIR/bin/nvcc" >> "$GITHUB_ENV"
          # The distro GCC may be newer than this CUDA release lists.
          echo "NVCC_APPEND_FLAGS=-allow-unsupported-compiler" >> "$GITHUB_ENV"
          echo "$CUDA_DIR/bin" >> "$GITHUB_PATH"

      # ── Third-party dependencies (llama.cpp, MuPDF, Tesseract...) ──────
      - name: Cache third-party dependencies
        id: deps
        uses: actions/cache@v6
        with:
          path: |
            external/lib/linux
            external/include/leptonica
            external/include/tesseract
            external/include/mupdf
            external/include/llamacpp
            external/include/SqliteVec
          key: deps-${{ matrix.id }}-cuda${{ env.CUDA_VERSION }}-${{ hashFiles('scripts/Linux/build_deps.sh') }}

      - name: Build third-party dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          HODEIA_CUDA=1 scripts/Linux/build_deps.sh "$RUNNER_TEMP/deps"
          # Free the disk: the CUDA build tree alone takes several GB.
          rm -rf "$RUNNER_TEMP/deps"
          df -h .

      # ── Hodeia ──────────────────────────────────────────────────────────
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$QT_DIR/$QT_VERSION/gcc_64" \
            -DHODEIA_BUNDLE_QT=ON \
            -DHODEIA_PKG_DISTRO=${{ matrix.format == 'DEB' && matrix.image || '' }}

      - name: Build
        run: cmake --build build

      # Every library in /opt/hodeia must resolve against the bundled Qt or
      # the system: report the missing ones by file before packaging.
      - name: Check the install tree
        run: |
          stage="$RUNNER_TEMP/stage"
          cmake --install build --prefix "$stage"
          status=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^ELF' || continue
            # libcuda.so.1 = NVIDIA driver, provided by the user's system.
            missing=$(ldd "$f" 2>/dev/null | grep 'not found' | grep -v 'libcuda\.so\.1' || true)
            if [ -n "$missing" ]; then
              echo "::error::${f#$stage}: missing libraries"
              echo "$missing"
              status=1
            fi
          done < <(find "$stage/opt/hodeia" -type f -print0)
          du -sh "$stage/opt/hodeia" "$stage/opt/hodeia"/{lib,plugins,qml,Resources}
          rm -rf "$stage"
          exit $status

      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.format }}

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: hodeia-${{ matrix.id }}
          path: build/*.${{ matrix.ext }}
          compression-level: 0   # already compressed

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/*.${{ matrix.ext }}
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
